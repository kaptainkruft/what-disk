# Turns each platform's build into its installable package and uploads it as package-<platform name>.
# Each platform's scripts folder provides build/<scripts>/package.sh <app-directory> <version> <name> <output>.
name: Package

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of platforms ({ "name", "scripts", "arch", "runner" }), as in .github/platforms.json
        type: string
        required: true
      version:
        description: Full semantic version, for example 0.1.3-alpha
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app-${{ matrix.platform.name }}
      - name: Unpack the build
        run: mkdir -p out/app && tar -xzf app-${{ matrix.platform.name }}.tar.gz -C out/app
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: build/${{ matrix.platform.scripts }}/package.sh out/app "$VERSION" "${{ matrix.platform.name }}" out/package
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform.name }}
          path: out/package/*
          if-no-files-found: error
          retention-days: 30
