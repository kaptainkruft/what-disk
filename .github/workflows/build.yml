# Builds the application for each platform, checks that it starts and scans, and uploads it as an artifact named
# app-<platform name>. Each platform's scripts folder provides build/<scripts>/publish.sh <arch> <output-directory>
# and build/<scripts>/smoke-test.sh <output-directory>. Every step runs in bash (Git Bash on Windows).
name: Build

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of platforms ({ "name", "scripts", "arch", "runner" }), as in .github/platforms.json
        type: string
        required: true
      version-prefix:
        description: Version without prerelease label, for example 0.1.3
        type: string
        required: true
      version-suffix:
        description: Prerelease label, or empty for a final release
        type: string
        default: ''
      build-timestamp:
        description: Release time in UTC (ISO 8601), embedded in the assemblies
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        env:
          VERSION_PREFIX: ${{ inputs.version-prefix }}
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
          BUILD_TIMESTAMP: ${{ inputs.build-timestamp }}
        run: build/${{ matrix.platform.scripts }}/publish.sh "${{ matrix.platform.arch }}" out/app
      - name: Smoke test
        run: build/${{ matrix.platform.scripts }}/smoke-test.sh out/app
      # Archived first so that file permissions, symbolic links and bundle structure survive the artifact upload.
      - name: Archive
        run: tar -czf app-${{ matrix.platform.name }}.tar.gz -C out/app .
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform.name }}
          path: app-${{ matrix.platform.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7
