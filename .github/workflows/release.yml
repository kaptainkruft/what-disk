# Tags the built commit with its version (every pipeline run, so the next run computes the next number) and, when
# requested, publishes a GitHub release with every platform's package attached.
name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Full semantic version, for example 0.1.3-alpha
        type: string
        required: true
      tag:
        description: Tag to create, for example v0.1.3-alpha
        type: string
        required: true
      prerelease:
        description: Whether the version is a prerelease
        type: boolean
        default: true
      create-release:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag the commit
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "WhatDisk $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - uses: actions/download-artifact@v8
        if: inputs.create-release
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Publish the GitHub release
        if: inputs.create-release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" packages/* --title "WhatDisk $VERSION" --generate-notes --verify-tag "${flags[@]}"
      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          CREATE_RELEASE: ${{ inputs.create-release }}
        run: |
          echo "Tagged \`$TAG\`." >>"$GITHUB_STEP_SUMMARY"
          if [[ "$CREATE_RELEASE" == "true" ]]; then
            echo "Published release [WhatDisk $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >>"$GITHUB_STEP_SUMMARY"
          fi
