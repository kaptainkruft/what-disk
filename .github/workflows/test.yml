# Runs every test project on each platform's runner (so each architecture is tested on its own hardware) and uploads
# the results as test-results-<platform name>. Tests of another platform's head run their portable parts and skip
# the rest, so every runner builds and checks all of the code.
name: Test

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of platforms ({ "name", "scripts", "arch", "runner" }), as in .github/platforms.json
        type: string
        required: true
      version-prefix:
        description: Version without prerelease label, for example 0.1.3
        type: string
        default: '0.0.0'
      version-suffix:
        description: Prerelease label, or empty for a final release
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    # The test script is bash, which Windows runners provide through Git Bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Each project is run on its own so that its report has a fixed, unique name (reports from projects run together
      # are named by timestamp and can overwrite each other). Every project runs even if an earlier one fails.
      - name: Test
        env:
          VERSION_PREFIX: ${{ inputs.version-prefix }}
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          status=0
          for project in tests/*/*.csproj; do
            name="$(basename "$project" .csproj)"
            echo "::group::$name"
            dotnet test --project "$project" --configuration Release \
              "-p:VersionPrefix=$VERSION_PREFIX" "-p:VersionSuffix=$VERSION_SUFFIX" \
              --results-directory "$GITHUB_WORKSPACE/test-results" \
              --report-xunit-trx --report-xunit-trx-filename "$name.trx" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Summary
        if: always()
        run: |
          for report in test-results/*.trx; do
            [[ -f "$report" ]] || continue
            counters="$(grep -o '<Counters [^>]*>' "$report" | head -n 1)"
            total="$(sed -nE 's/.* total="([0-9]+)".*/\1/p' <<<"$counters")"
            passed="$(sed -nE 's/.* passed="([0-9]+)".*/\1/p' <<<"$counters")"
            failed="$(sed -nE 's/.* failed="([0-9]+)".*/\1/p' <<<"$counters")"
            echo "- $(basename "$report" .trx): $passed of $total passed, $failed failed" >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.platform.name }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
